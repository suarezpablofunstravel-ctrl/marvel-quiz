<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina la Peli de Marvel</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #e62429; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    #score-board { font-size: 1.2rem; margin-bottom: 15px; color: #bbb; }
    #scene-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #scene-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .controls { display: flex; gap: 10px; width: 100%; max-width: 600px; }
    input {
      flex: 1;
      padding: 12px 15px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #e62429;
      color: white;
      transition: background 0.2s;
    }
    button:hover { background-color: #b81d22; }
    button.secondary { background-color: #333; }
    button.secondary:hover { background-color: #444; }
    #feedback { margin-top: 15px; font-size: 1.2rem; font-weight: bold; min-height: 28px; }
  </style>
</head>
<body>

  <h1>Marvel Frame Quiz</h1>
  <div id="score-board">Racha: <span id="streak">0</span></div>

  <div id="scene-container">
    <p id="loading">Cargando escena de Marvel...</p>
    <img id="scene-img" src="" alt="Escena de Marvel">
  </div>

  <div class="controls">
    <input type="text" id="guess-input" list="marvel-titles" placeholder="Escribí la película o serie..." autocomplete="off">
    <datalist id="marvel-titles"></datalist>
    <button onclick="checkGuess()">Adivinar</button>
    <button class="secondary" onclick="skipRound()">Saltar</button>
  </div>

  <div id="feedback"></div>

  <script>
    const API_KEY = '8e02f5b76d55c3cff72adceec9ddc29b'; // <-- PEGÁ TU API KEY ACÁ
    const MARVEL_COMPANY_ID = 420; // ID oficial de Marvel Studios en TMDB
    let catalog = [];
    let currentItem = null;
    let streak = 0;

    async function initGame() {
      try {
        // Traer películas y series de Marvel Studios (páginas 1 y 2)
        const endpoints = [
          `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_companies=${MARVEL_COMPANY_ID}&language=es-MX&page=1`,
          `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_companies=${MARVEL_COMPANY_ID}&language=es-MX&page=2`,
          `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_companies=${MARVEL_COMPANY_ID}&language=es-MX&page=1`
        ];

        const responses = await Promise.all(endpoints.map(url => fetch(url).then(r => r.json())));
        
        responses.forEach((data, index) => {
          const isTv = index === 2;
          data.results.forEach(item => {
            if (item.backdrop_path) {
              catalog.push({
                id: item.id,
                type: isTv ? 'tv' : 'movie',
                title: isTv ? item.name : item.title,
                originalTitle: isTv ? item.original_name : item.original_title
              });
            }
          });
        });

        // Llenar el autocompletado
        const datalist = document.getElementById('marvel-titles');
        catalog.forEach(item => {
          const option = document.createElement('option');
          option.value = item.title;
          datalist.appendChild(option);
          if (item.originalTitle !== item.title) {
            const optionOrig = document.createElement('option');
            optionOrig.value = item.originalTitle;
            datalist.appendChild(optionOrig);
          }
        });

        nextRound();
      } catch (err) {
        document.getElementById('loading').innerText = 'Error al cargar. Revisá tu API Key.';
      }
    }

    async function nextRound() {
      document.getElementById('feedback').innerText = '';
      document.getElementById('guess-input').value = '';
      document.getElementById('scene-img').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      currentItem = catalog[Math.floor(Math.random() * catalog.length)];

      // Pedir imágenes (capturas sin texto) de esa película o serie
      const imgRes = await fetch(`https://api.themoviedb.org/3/${currentItem.type}/${currentItem.id}/images?api_key=${API_KEY}`);
      const imgData = await imgRes.json();

      // Filtrar capturas limpias (sin idioma/letras)
      const cleanBackdrops = imgData.backdrops.filter(b => b.iso_639_1 === null);
      const pool = cleanBackdrops.length > 0 ? cleanBackdrops : imgData.backdrops;
      const randomImg = pool[Math.floor(Math.random() * pool.length)];

      const imgEl = document.getElementById('scene-img');
      imgEl.src = `https://image.tmdb.org/t/p/w1280${randomImg.file_path}`;
      imgEl.onload = () => {
        document.getElementById('loading').style.display = 'none';
        imgEl.style.display = 'block';
      };
    }

    function checkGuess() {
      const userGuess = document.getElementById('guess-input').value.trim().toLowerCase();
      if (!userGuess) return;

      const validTitles = [
        currentItem.title.toLowerCase(),
        currentItem.originalTitle.toLowerCase()
      ];

      if (validTitles.includes(userGuess)) {
        streak++;
        document.getElementById('streak').innerText = streak;
        document.getElementById('feedback').style.color = '#4caf50';
        document.getElementById('feedback').innerText = `¡Correcto! Era ${currentItem.title} (${currentItem.originalTitle})`;
        setTimeout(nextRound, 2000);
      } else {
        streak = 0;
        document.getElementById('streak').innerText = streak;
        document.getElementById('feedback').style.color = '#f44336';
        document.getElementById('feedback').innerText = 'Incorrecto, probá de nuevo o saltá.';
      }
    }

    function skipRound() {
      streak = 0;
      document.getElementById('streak').innerText = streak;
      document.getElementById('feedback').style.color = '#ff9800';
      document.getElementById('feedback').innerText = `Era: ${currentItem.title} (${currentItem.originalTitle})`;
      setTimeout(nextRound, 2500);
    }

    // Permitir enviar con Enter
    document.getElementById('guess-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkGuess();
    });

    initGame();
  </script>
</body>
</html>
